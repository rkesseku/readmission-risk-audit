[project]
name = "readmission-risk-audit"
version = "0.2.0"
description = "30-day readmission risk on UCI Diabetes 130-US Hospitals with patient-level splits, post-hoc calibration (Platt, isotonic, Venn-Abers), decision-curve analysis, subgroup fairness audit and bootstrap CIs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Reagan Kesseku" }]
license = { text = "MIT" }
keywords = ["readmission", "calibration", "fairness", "decision-curve-analysis", "healthcare", "xgboost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
experiment = ["optuna>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "optuna>=3.0"]

[project.scripts]
readmit = "readmit.cli:main"

[project.urls]
Homepage = "https://github.com/rkesseku/readmission-risk-audit"
Repository = "https://github.com/rkesseku/readmission-risk-audit"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["readmit*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
